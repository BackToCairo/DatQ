version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: smart_query_postgres
    environment:
      POSTGRES_DB: smart_query
      POSTGRES_USER: smart_query
      POSTGRES_PASSWORD: smart_query_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_query"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_query_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smart_query_redis
    command: redis-server --requirepass redis_2026
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - smart_query_network

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: smart_query_chromadb
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    environment:
      ANONYMIZED_TELEMETRY: "false"
    networks:
      - smart_query_network

  # Backend API
  api:
    build: ./backend
    container_name: smart_query_api
    environment:
      DB_USER: smart_query
      DB_PASSWORD: smart_query_2026
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smart_query
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_2026
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      JWT_SECRET: your-secret-key-change-in-production
      LLM_PROVIDER: openai
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: gpt-4o
      EMBEDDING_MODEL: text-embedding-3-small
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    networks:
      - smart_query_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chroma_data:

networks:
  smart_query_network:
    driver: bridge
